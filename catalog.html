<script>
    const isFullComponentVersion = false

    const popUpClass = 't778'
    const feedBackModalClass = 't702'
    let estate_products = []

    // url helpers
    const baseURL = 'https://store.tildaapi.com/api/getproductslist/'
    const rawSearchParams = {
        storepartuid: '478140529053',
        recid: '4071407101',
        c: '1790064169845',
        getparts: 'true',
        getoptions: 'true',
        slice: 1, // страница
        size: isFullComponentVersion ? 36 : 5, // кол-во элементов в ответе
        flag_root: 'withroot'
    }

    function composeProductsURL () {
        const clearURL = new URL(baseURL)
        for (const [key, value] of Object.entries(rawSearchParams)) {
            clearURL.searchParams.set(key, String(value))
        }
        return clearURL
    }
    //--url helpers

    window.addEventListener('DOMContentLoaded', () => {
        const customCatalogPlace = document.querySelector('.custom-catalog')

        const customCardsPlace = document.querySelector('.custom-card__container')
        const moreButton = customCatalogPlace.querySelector('.custom-card__request-button')
        const feedbackModalObjectPlace = document.querySelector('.' + feedBackModalClass + '__wrapper')
        let feedbackModalObjectContent
        if (feedbackModalObjectPlace) {
            feedbackModalObjectPlace.insertAdjacentHTML('afterbegin', `<div class="feedback-card underline"></div>`)
            feedbackModalObjectContent = feedbackModalObjectPlace.querySelector('.feedback-card')
        }

        const infoModal = document.querySelector('.' + popUpClass)
        const infoModalId = infoModal.parentNode.id.slice(3)
        let infoModalBody
        let infoModalBodyContentPlace
        let closeInfoModalButton
        const numberFields = [
            'Начальная цена',
            'Площадь',
            'Ежемесячный платеж',
            'Сумма НДС к возмещению',
            'Экономия по налогу на прибыль',
            'Общая сумма затрат с учётом выгоды по налогам',
            'Сумма договора лизинга'
        ]

        if (!isFullComponentVersion) {
            customCatalogPlace.classList.add('custom-catalog--short')
            let currentSwipe = 0
            let maxRight = 920
            let step = 355
            if (window.screen.availWidth <= 1024 && window.screen.availWidth >= 769) {
                maxRight = -1160
            }

            if (window.screen.availWidth <= 768) {
                maxRight = -2640
                step = window.screen.availWidth
            }

            const swipeLeft = customCatalogPlace.querySelector('#swipe-left')
            const swipeRight = customCatalogPlace.querySelector('#swipe-right')
            swipeRight.addEventListener('click', () => {
                swipeLeft.style.opacity = '1'
                swipeLeft.style.pointerEvents = 'auto'
                currentSwipe -= step
                if (currentSwipe <= maxRight) {
                    currentSwipe = maxRight
                    swipeRight.style.opacity = '0'
                    swipeRight.style.pointerEvents = 'none'
                } else {
                    swipeRight.style.opacity = '1'
                    swipeRight.style.pointerEvents = 'auto'
                }
                customCardsPlace.style.transform = `translate(${currentSwipe}px, 0)`
            })
            swipeLeft.addEventListener('click', () => {

                swipeRight.style.opacity = '1'
                swipeRight.style.pointerEvents = 'auto'
                currentSwipe += step
                if (currentSwipe > 0 && currentSwipe < step) {
                    currentSwipe = 0
                    swipeLeft.style.opacity = '0'
                    swipeLeft.style.pointerEvents = 'none'
                } else {
                    swipeLeft.style.opacity = '1'
                    swipeLeft.style.pointerEvents = 'auto'
                }
                customCardsPlace.style.transform = `translate(${currentSwipe}px, 0)`
            })
        }

        // Tilda modals options
        var prodcard_optsObj = {
            blockId: '',
            hasWrap: 'true',
            txtPad: '',
            bgColor: '',
            borderRadius: '',
            shadow: '',
            shadowSize: '',
            shadowOpacity: '',
            shadowHover: '',
            shadowSizeHover: '',
            shadowOpacityHover: '',
            shadowShiftyHover: '',
            btnTitle1: '',
            btnLink1: 'popup',
            btnTitle2: '',
            btnLink2: 'popup',
            showOpts: false,
            style: '',
            hasImg: true,
            hasDescr: true,
            hasSeparator: true
        };
        var price_optsObj = {color: '', colorOld: '', position: '', priceRange: ''};
        var popup_optsObj = {
            popupContainer: '',
            columns: '6',
            columns2: '6',
            isVertical: '',
            align: '',
            btnTitle: 'Запросить объект',
            closeText: 'More products',
            iconColor: '#000000',
            containerBgColor: '#ffffff',
            overlayBgColor: '#ffffff',
            overlayBgColorRgba: 'rgba(255,255,255,1)',
            popupStat: '',
            tabsPosition: '',

            mobileGalleryStyle: ''
        };
        var slider_optsObj = {
            anim_speed: '',
            videoPlayerIconColor: '',
            cycle: '',
            controls: 'arrowsthumbs',
            bgcolor: '#ebebeb'
        };
        var slider_dotsOptsObj = {size: '', bgcolor: '', bordersize: '', bgcoloractive: ''};
        var slider_slidesOptsObj = {zoomable: true, bgsize: 'cover', ratio: '1'};
        var typography_optsObj = {descrColor: '', titleColor: '', optionsColor: ''};
        var default_sort = {default: null, in_stock: false};
        const popupOptions =  {
            recid: '4071407101',
            storepart: '478140529053',
            previewmode: 'yes',
            prodCard: prodcard_optsObj,
            popup_opts: popup_optsObj,
            defaultSort: default_sort,
            galleryStyle: '',
            slider_opts: slider_optsObj,
            slider_dotsOpts: slider_dotsOptsObj,
            slider_slidesOpts: slider_slidesOptsObj,
            typo: typography_optsObj,
            price: price_optsObj,
            blocksInRow: '3',

            titleRelevants: '',

            relevants_quantity: '4',
            sliderthumbsside: '',

            isTitleClip: false,
            horizontalScrollHint: 'hand'
        };
        //--Tilda modals options

        window.putProductInfo = function (product) {
            if (infoModalBodyContentPlace) {
                const title = product.title || ('Объект недвижимости ' + product.chars['Город'] + ', ' + 'Тип: ' + product.chars['Тип недвижимости'] + ', ' + 'Статус: ' + product.chars['Статус'])

                infoModalBodyContentPlace.innerHTML = `
                    <div class="info-modal">
                        <div class="info-modal__top">
                           <div class="js-store-prod-name js-product-name t-store__prod-popup__name t-typography__title t-name t-name_xl">
                              ${ title }
                           </div>

                           ${ product.descr ? `<div class="t-store__prod-popup__sku"> ${ product.descr } </div>` : '' }

                           <div class="info-modal__grid">
                              <div class="info-modal__grid__item">
                                  <p class="info-modal__grid__name">Площадь</p>
                                  <p class="info-modal__grid__value">
                                      ${ product.chars["Площадь"] ?
                    ` ${product.chars["Площадь"]} <span>м<sup>2</sup></span>` :
                    '<p class="gray">Не указана</p>'
                }
                                  </p>
                              </div>

                              <div class="info-modal__grid__item">
                                  <p class="info-modal__grid__name">Стоимость</p>
                                  <p class="info-modal__grid__value">
                                        ${ product.chars["Начальная цена"] ?
                    `от ${ product.chars["Начальная цена"].toLocaleString('ru-RU', { minimumFractionDigits: 0 }) } <span>₽</span>` :
                    '<p class="gray">Не указана</p>'
                }
                                  </p>
                              </div>

                              <div class="info-modal__grid__item">
                                  <p class="info-modal__grid__name">Платеж в месяц</p>
                                  <p class="info-modal__grid__value">
                                        ${ product.chars["Ежемесячный платеж"] ?
                    `от ${ product.chars["Ежемесячный платеж"].toLocaleString('ru-RU', { minimumFractionDigits: 0 }) } <span>₽</span>` :
                    '<p class="gray">Не указан</p>'
                }
                                  </p>
                              </div>

                               <div class="info-modal__grid__item">
                                    <p class="info-modal__grid__name">Аванс</p>
                                    <p class="info-modal__grid__value">от 10 <span>%</span></p>
                               </div>
                           </div>

                           <a
                            href="#real_estate_feedback"
                            id="feedback_button"
                            class="custom-card__request-button"
                            >
                              Запросить объект
                           </a>

                           <div class="info-modal__table">
                              <p class="info-modal__table__header">Условия лизинга</p>

                              <div class="info-modal__talbe__wrapper">
                                  <div class="info-modal__table__item underline">
                                    <span>Авансовый платеж</span>
                                    <b class="orange">от 10%</b>
                                  </div>

                                  <div class="info-modal__table__item underline">
                                    <span>Сумма аванса</span>

                                    ${
                    product.chars["Начальная цена"] ? `
                                          <b class="orange">от ${ Math.floor(Number(product.chars["Начальная цена"]) * 0.1).toLocaleString('ru-RU', { minimumFractionDigits: 0 }) } ₽</b>
                                        ` : '<span class="gray">Не указан</span>'
                }
                                  </div>

                                  <div class="info-modal__table__item underline">
                                    <span>Срок лизинга</span>
                                    <b>12 - 60 мес.</b>
                                  </div>

                                  <div class="info-modal__table__item underline">
                                    <span>Ежемес. платеж</span>

                                    ${
                    product.chars["Ежемесячный платеж"] ? `
                                          <b class="orange">от ${ product.chars["Ежемесячный платеж"].toLocaleString('ru-RU', { minimumFractionDigits: 0 })} ₽</b>
                                        ` : '<span class="gray">Не указан</span>'
                }
                                  </div>

                                  ${ product.chars["Сумма НДС к возмещению"] ? `
                                    <div class="info-modal__table__item underline">
                                      <span>НДС в платежах</span>
                                      <b>Включен</b>
                                    </div>
                                    ` : '' }
                              </div>
                            </div>
                        </div>
                    </div>
                `

                infoModalBodyContentPlace.querySelector('#feedback_button').addEventListener('click', () => {
                    closeInfoModalButton.click()
                    window.passObjectDataInFeedBackModal(product.uid)
                })
            }
        }

        window.passObjectDataInFeedBackModal = function (productId) {
            const thisProduct = estate_products.find(product => product.uid === Number(productId))

            if (thisProduct && feedbackModalObjectPlace) {
                const IdInput = feedbackModalObjectPlace.querySelector('input[name="estate_id"]')
                if (IdInput) {
                    IdInput.value = thisProduct.uid
