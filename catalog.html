<section id="custom-catalog">
    <div class="t-container">
        <div class="custom-card__container"></div>
    </div>
</section>

<style>
    #custom-catalog {
        padding: 80px 0;
    }

    #rec4071407101 {
        display: none;
    }

    .custom-card {
        position: relative;
        padding: 12px;
        border-radius: 12px;
        background-color: white;
        border: 1px solid #ccd0d4;
        max-width: 300px;
        font-family: "Somic", Arial, sans-serif;
        box-shadow: 4px 4px 7px 0 rgba(34, 60, 80, 0.25);
        transition: all 0.3s ease;
    }
    .custom-card:hover {
        box-shadow: 4px 4px 7px 0 rgba(223, 112, 0, 0.25);
        border-color: #df7000;
    }
    .custom-card__top {
        border-radius: 12px;
        overflow: hidden;
        aspect-ratio: 4/3;
        margin-bottom: 12px;
    }
    .custom-card__top img {
        object-fit: cover;
        height: 100%;
    }
    .custom-card__info {
        color: black;
        margin-bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .custom-card__container {
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
    }
    .custom-card__flex {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .custom-card__label {
        position: absolute;
        top: -10px;
        right: -10px;
        padding: 14px;
        border-radius: 25px;
        background-color: #14a5de;
        font-size: 18px;
        font-weight: 500;
        box-shadow: 4px 4px 7px 0 rgba(34, 60, 80, 0.25);
    }
    .custom-card__label--in-progress {
        background-color: #ffd916;
    }
    .custom-card__label--ready {
        background-color: #8bd310;
    }
    .custom-card__type {
        font-size: 18px;
    }
    .custom-card__sku {
        color: #b5c3cd;
        font-size: 14px;
        align-self: flex-end;
    }
    .custom-card__request-button {
        display: block;
        margin-top: 24px;
        text-align: center;
        padding: 10px;
        border-radius: 5px;
        border: none;
        white-space: nowrap;
        cursor: pointer;
        font-size: 16px;
        font-family: inherit;
        font-weight: 600;
        transition: all 0.3s ease;
        color: white;
        background-color: #ff8000;
    }
    .custom-card__request-button:hover {
        background: #df7000;
    }
</style>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        fetch('https://store.tildaapi.com/api/getproductslist/?storepartuid=478140529053&recid=4071407101&c=1790064169845&getparts=true&getoptions=true&slice=1&size=36&flag_root=withroot')
            .then((response) => {
                response.json()
                    .then((productsResponse) => {
                        if (productsResponse.products && productsResponse.products.length) {
                            const products = productsResponse.products
                            const customCardsPlace = document.querySelector('.custom-card__container')
                            if (customCardsPlace) {
                                const composedCards = products.map((product) => {
                                    const productCard = document.createElement('div')
                                    productCard.className = 'custom-card'
                                    const rawChars = product.characteristics
                                    const chars = {}
                                    if (rawChars && rawChars.length) {
                                        rawChars.forEach(char => {
                                            chars[char.title] = char.value
                                        })
                                    }
                                    console.log(product.gallery)
                                    const productURL = product.url.split('/').pop()
                                    let productImage
                                    if (product.gallery && product.gallery.length) {
                                        productImage = JSON.parse(product.gallery)[0].img
                                    } else {
                                        productImage = 'https://static.tildacdn.com/tild6339-3134-4430-b338-333965313536/logo_clean.svg'
                                    }
                                    productCard.innerHTML = `
                                    <div
                                      class="${ chars["Статус"] === 'Строится' ? 'custom-card__label custom-card__label--in-progress' : 'custom-card__label custom-card__label--ready' }"
                                      >
                                        ${ product.mark }
                                      </div>
                                        <a href="/tproduct/${ productURL }">
                                            <div class="custom-card__top">
                                                <img
                                                    src="${ productImage }"
                                                    alt="${ product.title }"
                                                >
                                            </div>

                                            <div
                                                class="custom-card__info"
                                            >
                                                <div class="custom-card__flex">
                                                    <div class="custom-card__type">${ chars["Тип недвижимости"] }</div>
                                                    <p>${ chars["Площадь"] } м<sup>2</sup></p>
                                                </div>
                                                <div class="custom-card__city">
                                                    ${ chars["Город"] }
                                                </div>

                                                <div class="custom-card__flex">
                                                    <span>Цена:</span>
                                                    <span class="custom-card__price">от ${ chars["Город"] } ₽</span>
                                                </div>

                                                <div class="custom-card__flex">
                                                    <span>Платеж:</span>
                                                    <span class="custom-card__price">от ${ chars["Ежемесячный платеж"] } ₽</span>
                                                </div>

                                                <div class="custom-card__flex">
                                                    <span>Вернется налогами:</span>
                                                    <span class="custom-card__price">от ${ chars["Сумма НДС к возмещению"] } ₽</span>
                                                </div>

                                                <span class="custom-card__sku">${ product.sku }</span>
                                            </div>
                                        </a>

                                        <a
                                            class="custom-card__request-button"
                                            href="#real_estate_feedback"
                                        >
                                            Запросить объект
                                        </a>
                                    `
                                    return productCard
                                })

                                if (composedCards.length) {
                                    customCardsPlace.append(...composedCards)
                                }
                            }
                        }
                    })
            })
    })
</script>
