                '    <animate attributeName="r" begin="0.75s" calcMode="spline" dur="1s" keySplines="0.2 0.2 0.4 0.8;0.2 0.2 0.4 0.8;0.2 0.2 0.4 0.8" repeatCount="indefinite" values="0;2;0;0" />\n' +
                '  </circle>\n' +
                '  <circle cx="12" cy="2" r="0" fill="white" transform="rotate(315 12 12)">\n' +
                '    <animate attributeName="r" begin="0.875s" calcMode="spline" dur="1s" keySplines="0.2 0.2 0.4 0.8;0.2 0.2 0.4 0.8;0.2 0.2 0.4 0.8" repeatCount="indefinite" values="0;2;0;0" />\n' +
                '  </circle>\n' +
                '</svg>'
            rawSearchParams.slice++
            getProducts()
        }

        window.getProducts = function () {
            fetch(composeProductsURL())
                .then((response) => {
                    response.json()
                        .then((productsResponse) => {
                            if (productsResponse.products && productsResponse.products.length) {
                                estate_products = productsResponse.products
                                estate_products.forEach((product) => {
                                    product.chars = {}

                                    if (product.characteristics && product.characteristics.length) {
                                        product.characteristics.forEach(char => {
                                            let charValue
                                            if (numberFields.includes(char.title)) {
                                                if (char.value && char.value !== '0') {
                                                    const numberValue = parseInt(char.value.replaceAll(/\s+/g, ''))
                                                    if (!isNaN(numberValue)) {
                                                        charValue = numberValue
                                                    } else charValue = 0
                                                } else charValue = 0
                                            } else charValue = char.value
                                            product.chars[char.title] = charValue
                                        })
                                    }
                                })

                                if (customCardsPlace) {
                                    const composedCards = estate_products.map((product) => {
                                        const productCard = document.createElement('div')
                                        productCard.className = 'custom-card'
                                        let productImage
                                        if (product.gallery && product.gallery.length) {
                                            productImage = JSON.parse(product.gallery)[0].img
                                        } else {
                                            productImage = 'https://static.tildacdn.com/tild6339-3134-4430-b338-333965313536/logo_clean.svg'
                                        }

                                        productCard.innerHTML = `
                                        <div class="${
                                            product.chars["Статус"] === 'Строится' ? 'custom-card__label custom-card__label--in-progress' : 'custom-card__label custom-card__label--ready'
                                        }">
                                          ${product.chars["Статус"]}
                                        </div>
                                        <div
                                          class="js-custom-open-popup"
                                          onclick="window.openPopUp(${product.uid})"
                                        >
                                            <div class="custom-card__top">
                                                <img
                                                    src="${productImage}"
                                                    alt="${product.title}"
                                                    loading="lazy"
                                                >
                                            </div>

                                            <div class="custom-card__info">
                                                <div class="custom-card__flex">
                                                    ${ product.chars["Категория"] ? `<div class="custom-card__type">${product.chars["Категория"]}</div>` : '<div></div>'}

                                                    ${ product.chars["Площадь"] ? `
                                                          <div class="custom-card__area">
                                                              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 32 32">
                                                                  <path d="M0 0h32v32H0z" fill="none" />
                                                                  <path fill="white" d="M27 22.142V9.858A3.992 3.992 0 1 0 22.142 5H9.858A3.992 3.992 0 1 0 5 9.858v12.284A3.992 3.992 0 1 0 9.858 27h12.284A3.992 3.992 0 1 0 27 22.142M26 4a2 2 0 1 1-2 2a2 2 0 0 1 2-2M4 6a2 2 0 1 1 2 2a2 2 0 0 1-2-2m2 22a2 2 0 1 1 2-2a2 2 0 0 1-2 2m16.142-3H9.858A4 4 0 0 0 7 22.142V9.858A4 4 0 0 0 9.858 7h12.284A4 4 0 0 0 25 9.858v12.284A3.99 3.99 0 0 0 22.142 25M26 28a2 2 0 1 1 2-2a2.003 2.003 0 0 1-2 2" />
                                                              </svg>
                                                              ${product.chars["Площадь"]} м<sup>2</sup>
                                                          </div>
                                                        ` : '<div></div>' }
                                                </div>

                                                ${ product.chars["Город"] ? `
                                                    <div class="custom-card__city">
                                                       <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
                                                          <path d="M0 0h16v16H0z" fill="none" />
                                                          <path fill="black" d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6a3 3 0 0 1 0 6" />
                                                       </svg>
                                                       <span>${product.chars["Город"]}</span>
                                                    </div>` : '<div></div>'
                                        }

                                                <div class="custom-card__flex underline">
                                                    <span>Цена:</span>
                                                    ${ product.chars["Начальная цена"] ? `
                                                        <span class="custom-card__price">от ${product.chars["Начальная цена"].toLocaleString('ru-RU', {
                                            style: 'currency',
                                            currency: 'RUB',
                                            minimumFractionDigits: 0
                                        })}</span>
                                                        ` : '<span class="custom-card__price">Не указана</span>'
                                        }
                                                </div>

                                                <div class="custom-card__flex underline">
                                                    <span>Платеж:</span>
                                                    ${ product.chars["Ежемесячный платеж"] ? `
                                                       <span class="custom-card__price">от ${product.chars["Ежемесячный платеж"].toLocaleString('ru-RU', { style: 'currency', currency: 'RUB', minimumFractionDigits: 0 } ) }</span>
                                                       ` : '<span class="custom-card__price">Не указан</span>' }
                                                </div>

                                                <div class="custom-card__flex">
                                                    <span>Вернется налогами:</span>

                                                    ${ product.chars["Сумма НДС к возмещению"] ? `
                                                       <span class="custom-card__price">от ${product.chars["Сумма НДС к возмещению"].toLocaleString('ru-RU', { style: 'currency', currency: 'RUB', minimumFractionDigits: 0 } ) }</span>
                                                       ` : '<span class="custom-card__price">Не указано</span>' }
                                                </div>

                                                <span class="custom-card__sku">${product.uid}</span>
                                            </div>
                                        </div>
                                        <a
                                            onclick="window.passObjectDataInFeedBackModal(${product.uid})"
                                            class="custom-card__request-button"
                                            href="#real_estate_feedback"
                                        >
                                            Запросить объект
                                        </a>
                                    `
                                        return productCard
                                    })

                                    if (composedCards.length) {
                                        customCardsPlace.append(...composedCards)
                                        customCatalogPlace.style.opacity = '1'
                                        if (!('nextslice' in productsResponse)) {
                                            moreButton.remove()
                                        }
                                        moreButton.disabled = false
                                        moreButton.innerHTML = 'Загрузить еще'
                                    }
                                }
                            }
                        }).catch((error) => {
                        console.log('Ошибка получения позиций недвижимости: ' + error)
                    })
                })
        }

        getProducts()
    })
</script>
