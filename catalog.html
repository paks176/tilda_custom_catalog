<section id="custom-catalog">
    <div class="t-container">
        <div class="custom-card__container"></div>
    </div>
</section>

<style>
    #custom-catalog {
        padding: 80px 0;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    #rec4071407101 {
        padding: 0 !important;
        background: none;
    }

    .js-store-parts-select-container {
        display: none;
    }
    .js-store-grid-cont-preloader {
        display: none;
    }
    .js-store-grid-cont {
        display: none;
    }
    .js-custom-open-popup {
        cursor: pointer
    }

    .custom-card {
        position: relative;
        padding: 12px;
        border-radius: 12px;
        background-color: white;
        border: 1px solid #ccd0d4;
        max-width: 300px;
        width: 100%;
        font-family: "Somic", Arial, sans-serif;
        box-shadow: 4px 4px 7px 0 rgba(34, 60, 80, 0.25);
        transition: all 0.3s ease;
    }
    .custom-card:hover {
        box-shadow: 4px 4px 7px 0 rgba(223, 112, 0, 0.25);
        border-color: #df7000;
    }
    .custom-card__top {
        border-radius: 12px;
        overflow: hidden;
        aspect-ratio: 4/3;
        background-color: lightgray;
        margin-bottom: 12px;
    }
    .custom-card__top img {
        object-fit: cover;
        height: 100%;
    }
    .custom-card__info {
        color: black;
        margin-bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .custom-card__container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 48px 32px;
        justify-items: center;
    }
    .custom-card__flex {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .custom-card__label {
        position: absolute;
        top: -10px;
        right: -10px;
        padding: 14px;
        border-radius: 25px;
        background-color: #14a5de;
        font-size: 18px;
        font-weight: 500;
        box-shadow: 4px 4px 7px 0 rgba(34, 60, 80, 0.25);
    }
    .custom-card__label--in-progress {
        background-color: #ffd916;
    }
    .custom-card__label--ready {
        background-color: #8bd310;
    }
    .custom-card__type {
        font-size: 18px;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 25px;
        background-color: darkslateblue;
        color: white;
        line-height: 23px;
    }
    .custom-card__area {
        font-size: 18px;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 25px;
        background-color: royalblue;
        color: white;
        display: flex;
        align-items: center;
        gap: 8px;
        line-height: 23px;
    }
    .custom-card__city {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 18px;
        font-weight: 500;
    }
    .custom-card__price {
        font-style: italic;
    }
    .custom-card__sku {
        color: #b5c3cd;
        font-size: 14px;
        align-self: flex-end;
        margin-top: 12px;
    }
    .custom-card__request-button {
        display: block;
        margin-top: 24px;
        text-align: center;
        padding: 10px;
        border-radius: 12px;
        border: none;
        white-space: nowrap;
        cursor: pointer;
        font-size: 16px;
        font-family: inherit;
        font-weight: 600;
        transition: all 0.3s ease;
        color: white;
        background-color: #ff8000;
    }
    .custom-card__request-button:hover {
        background: #df7000;
    }
    .underline {
        border-bottom: 1px solid #ccd0d4;
        padding-bottom: 8px;
    }
    .feedback-card {
        margin-bottom: 24px;
        font-family: "Somic", Arial, sans-serif;
        padding-bottom: 24px;
    }
    .feedback-card img {
        max-width: 100%;
        width: 100%;
        height: auto;
        border-radius: 16px;
        margin-bottom: 12px;
    }
    .t702 .t-submit {
        border-radius: 12px !important;
        background-color: #ff8000 !important;
    }
    .t702 .t-submit:hover {
        background-color: #df7000 !important;
    }

    /* стили для модалки с подробной инфой */
    .t-store__prod-popup__btn {
        border-radius: 12px !important;
        background-color: #ff8000 !important;
    }

    .t-store__prod-popup__btn:hover {
        background-color: #df7000 !important;
    }

    .info-modal .info-modal__top {

    }
</style>

<script>
    const popUpClass = 't778'
    const feedBackModalClass = 't702'
    const estateRequestURL = 'https://store.tildaapi.com/api/getproductslist/?storepartuid=478140529053&recid=4071407101&c=1790064169845&getparts=true&getoptions=true&slice=1&size=36&flag_root=withroot'

    window.addEventListener('DOMContentLoaded', () => {
        const customCatalogPlace = document.getElementById('custom-catalog')
        const feedbackModalObjectPlace = document.querySelector('.' + feedBackModalClass + '__wrapper')
        let feedbackModalObjectContent
        if (feedbackModalObjectPlace) {
            feedbackModalObjectPlace.insertAdjacentHTML('afterbegin', `<div class="feedback-card underline"></div>`)
            feedbackModalObjectContent = feedbackModalObjectPlace.querySelector('.feedback-card')
        }
        const infoModal = document.querySelector('.' + popUpClass)
        const infoModalId = infoModal.parentNode.id.slice(3)
        let infoModalBody
        let infoModalButton
        let closeInfoModalButton
        var prodcard_optsObj = {
            blockId: '',
            hasWrap: 'true',
            txtPad: '',
            bgColor: '',
            borderRadius: '',
            shadow: '',
            shadowSize: '',
            shadowOpacity: '',
            shadowHover: '',
            shadowSizeHover: '',
            shadowOpacityHover: '',
            shadowShiftyHover: '',
            btnTitle1: '',
            btnLink1: 'popup',
            btnTitle2: '',
            btnLink2: 'popup',
            showOpts: false,
            style: '',
            hasImg: true,
            hasDescr: true,
            hasSeparator: true
        };
        var price_optsObj = {color: '', colorOld: '', position: '', priceRange: ''};
        var popup_optsObj = {
            popupContainer: '',
            columns: '6',
            columns2: '6',
            isVertical: '',
            align: '',
            btnTitle: 'Запросить объект',
            closeText: 'More products',
            iconColor: '#000000',
            containerBgColor: '#ffffff',
            overlayBgColor: '#ffffff',
            overlayBgColorRgba: 'rgba(255,255,255,1)',
            popupStat: '',
            tabsPosition: '',
            fixedButton: false,
            mobileGalleryStyle: ''
        };
        var slider_optsObj = {
            anim_speed: '',
            videoPlayerIconColor: '',
            cycle: '',
            controls: 'arrowsthumbs',
            bgcolor: '#ebebeb'
        };
        var slider_dotsOptsObj = {size: '', bgcolor: '', bordersize: '', bgcoloractive: ''};
        var slider_slidesOptsObj = {zoomable: true, bgsize: 'cover', ratio: '1'};
        var typography_optsObj = {descrColor: '', titleColor: '', optionsColor: ''};
        var default_sort = {default: null, in_stock: false};

        const popupOptions =  {
            recid: '4071407101',
            storepart: '478140529053',
            previewmode: 'yes',
            prodCard: prodcard_optsObj,
            popup_opts: popup_optsObj,
            defaultSort: default_sort,
            galleryStyle: '',
            slider_opts: slider_optsObj,
            slider_dotsOpts: slider_dotsOptsObj,
            slider_slidesOpts: slider_slidesOptsObj,
            typo: typography_optsObj,
            price: price_optsObj,
            blocksInRow: '3',
            colClass: 't-col t-col_4',
            sidebar: false,
            colWidth: '360',
            colClassFullWidth: 't-col t-col_12',
            imageHover: true,
            imageHeight: '',
            imageWidth: '',
            imageRatio: '1',
            imageRatioClass: '',
            align: 'left',
            vindent: '',
            isHorizOnMob: false,
            itemsAnim: '',
            hasOriginalAspectRatio: false,
            size: 36,
            markColor: '#ffffff',
            markBgColor: '#ff4a4a',
            currencySide: 'r',
            currencyTxt: 'р.',
            currencySeparator: ',',
            currencyDecimal: '',
            btnSize: 'xs',
            buttonRadius: '5px',
            buttonBgColor: '#000000',
            isFlexCols: '',
            hideStoreParts: false,
            verticalAlignButtons: false,
            hideFilters: false,
            titleRelevants: '',
            showRelevants: '',
            showPagination: '',
            tabs: '',
            relevants_slider: false,
            relevants_quantity: '4',
            sliderthumbsside: '',
            showStoreBtnQuantity: '',
            verticalAlign: '',
            rightColumnWidth: '',
            isTitleClip: false,
            horizontalScrollHint: 'hand'
        };

        window.putProductInfo = function (product) {
            if (infoModalBody) {
                const title = product.title || ('Объект недвижимости ' + product.chars['Город'] + ', ' + 'Тип: ' + product.chars['Тип недвижимости'] + ', ' + 'Статус: ' + product.chars['Статус'])

                infoModalBody.innerHTML = `
                    <div class="info-modal">
                        <div class="info-modal__top">
                           <div class="js-store-prod-name js-product-name t-store__prod-popup__name t-typography__title t-name t-name_xl">
                              ${ title }
                           </div>

                           ${ product.descr ? `<div class="t-store__prod-popup__sku"> ${ product.descr } </div>` : '' }

                           <div class="info-modal__grid">
                               ${ product.descr ? `<div class="t-store__prod-popup__sku"> ${ product.descr } </div>` : '' }
                           </div>
                        </div>
                    </div>
                `
            }
        }

        window.passObjectDataInFeedBackModal = function (productId) {
            const thisProduct = window.estate_products.find(product => product.uid === Number(productId))

            if (thisProduct && feedbackModalObjectPlace) {
                const IdInput = feedbackModalObjectPlace.querySelector('input[name="estate_id"]')
                if (IdInput) {
                    IdInput.value = thisProduct.uid
                }
                const nameInput = feedbackModalObjectPlace.querySelector('input[name="estate_name"]')
                if (nameInput) {
                    nameInput.value = 'Заявка на недвижимость: ' + thisProduct.chars["Город"] + ', ' + thisProduct.chars["Тип недвижимости"] + ', ' + thisProduct.chars["Площадь"] + ' м2'
                }
                const linkInput = feedbackModalObjectPlace.querySelector('input[name="estate_link"]')
                if (linkInput) {
                    linkInput.value = window.location.href + '/tproduct/' + thisProduct.uid
                }
                let productImage

                if (thisProduct.gallery && thisProduct.gallery.length) {
                    productImage = JSON.parse(thisProduct.gallery)[0].img
                } else {
                    productImage = 'https://static.tildacdn.com/tild6339-3134-4430-b338-333965313536/logo_clean.svg'
                }

                feedbackModalObjectContent.innerHTML = ''

                feedbackModalObjectContent.insertAdjacentHTML('afterbegin', `
                      <img src="${productImage}" alt="${thisProduct.title}">
                      <div class="custom-card__flex">
                          <div class="custom-card__city">
                                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
                                  <path d="M0 0h16v16H0z" fill="none" />
                                  <path fill="black" d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6a3 3 0 0 1 0 6" />
                                </svg>
                              <span>${chars["Город"]}</span>
                            </div>
                          <div class="custom-card__type">${thisProduct.chars["Тип недвижимости"]}</div>
                        <div class="custom-card__area">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 32 32">
                              <path d="M0 0h32v32H0z" fill="none" />
                              <path fill="white" d="M27 22.142V9.858A3.992 3.992 0 1 0 22.142 5H9.858A3.992 3.992 0 1 0 5 9.858v12.284A3.992 3.992 0 1 0 9.858 27h12.284A3.992 3.992 0 1 0 27 22.142M26 4a2 2 0 1 1-2 2a2 2 0 0 1 2-2M4 6a2 2 0 1 1 2 2a2 2 0 0 1-2-2m2 22a2 2 0 1 1 2-2a2 2 0 0 1-2 2m16.142-3H9.858A4 4 0 0 0 7 22.142V9.858A4 4 0 0 0 9.858 7h12.284A4 4 0 0 0 25 9.858v12.284A3.99 3.99 0 0 0 22.142 25M26 28a2 2 0 1 1 2-2a2.003 2.003 0 0 1-2 2" />
                            </svg>
                            ${thisProduct.chars["Площадь"]} м<sup>2</sup>
                          </div>
                      </div>
                `)
            }
        }

        window.openPopUp = function (productId) {
            const thisProduct = window.estate_products.find(product => product.uid === Number(productId))

            if (thisProduct && window.t_store_openProductPopup) {
                if (!infoModalButton) {
                    infoModalButton = infoModal.querySelector('.t-store__prod-popup__btn')
                    infoModalButton.href = '#real_estate_feedback'
                }
                if (!closeInfoModalButton) {
                    closeInfoModalButton = infoModal.querySelector('.t-popup__close')
                }
                if (!infoModalBody) {
                    infoModalBody = infoModal.querySelector('.t-store__prod-popup__info')
                    putProductInfo(thisProduct)
                    infoModalBody.innerHTML = ''
                }

                infoModalButton.addEventListener('click', () => {
                    closeInfoModalButton.click()
                    window.passObjectDataInFeedBackModal(thisProduct.uid)
                })

                window.t_store_openProductPopup(infoModalId, popupOptions, thisProduct, false, false, false)
            }
        }

        window.estate_products = []

        fetch(estateRequestURL)
            .then((response) => {
                response.json()
                    .then((productsResponse) => {
                        if (productsResponse.products && productsResponse.products.length) {
                            window.estate_products = productsResponse.products
                            window.estate_products.forEach((product) => {
                                product.chars = {}

                                if (product.characteristics && product.characteristics.length) {
                                    product.characteristics.forEach(char => {
                                        product.chars[char.title] = char.value
                                    })
                                }
                            })
                            const customCardsPlace = document.querySelector('.custom-card__container')
                            if (customCardsPlace) {
                                const composedCards = window.estate_products.map((product) => {
                                    const productCard = document.createElement('div')
                                    productCard.className = 'custom-card'
                                    let productImage
                                    if (product.gallery && product.gallery.length) {
                                        productImage = JSON.parse(product.gallery)[0].img
                                    } else {
                                        productImage = 'https://static.tildacdn.com/tild6339-3134-4430-b338-333965313536/logo_clean.svg'
                                    }
                                    productCard.innerHTML = `
                                        <div
                                      class="${ product.chars["Статус"] === 'Строится' ? 'custom-card__label custom-card__label--in-progress' : 'custom-card__label custom-card__label--ready' }"
                                      >
                                        ${ product.mark }
                                      </div>
                                        <div
                                        class="js-custom-open-popup"
                                        onclick="window.openPopUp(${ product.uid })"
                                        >
                                            <div class="custom-card__top">
                                                <img
                                                    src="${ productImage }"
                                                    alt="${ product.title }"
                                                >
                                            </div>

                                            <div
                                                class="custom-card__info"
                                            >
                                                <div class="custom-card__flex">
                                                    <div class="custom-card__type">${ chars["Тип недвижимости"] }</div>
                                                    <div class="custom-card__area">
                                                      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 32 32">
                                                          <path d="M0 0h32v32H0z" fill="none" />
                                                          <path fill="white" d="M27 22.142V9.858A3.992 3.992 0 1 0 22.142 5H9.858A3.992 3.992 0 1 0 5 9.858v12.284A3.992 3.992 0 1 0 9.858 27h12.284A3.992 3.992 0 1 0 27 22.142M26 4a2 2 0 1 1-2 2a2 2 0 0 1 2-2M4 6a2 2 0 1 1 2 2a2 2 0 0 1-2-2m2 22a2 2 0 1 1 2-2a2 2 0 0 1-2 2m16.142-3H9.858A4 4 0 0 0 7 22.142V9.858A4 4 0 0 0 9.858 7h12.284A4 4 0 0 0 25 9.858v12.284A3.99 3.99 0 0 0 22.142 25M26 28a2 2 0 1 1 2-2a2.003 2.003 0 0 1-2 2" />
                                                      </svg>
                                                      ${ chars["Площадь"] } м<sup>2</sup>
                                                    </div>
                                                </div>
                                                <div class="custom-card__city">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
                                                      <path d="M0 0h16v16H0z" fill="none" />
                                                      <path fill="black" d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6a3 3 0 0 1 0 6" />
                                                    </svg>
                                                    <span>${ chars["Город"] }</span>
                                                </div>

                                                <div class="custom-card__flex underline">
                                                    <span>Цена:</span>
                                                    <span class="custom-card__price">от ${ Number(chars["Начальная цена"]).toLocaleString('ru-RU', { style: 'currency', currency: 'RUB', minimumFractionDigits: 0 }) }</span>
                                                </div>

                                                <div class="custom-card__flex underline">
                                                    <span>Платеж:</span>
                                                    <span class="custom-card__price">от ${ Number(chars["Ежемесячный платеж"]).toLocaleString('ru-RU', { style: 'currency', currency: 'RUB', minimumFractionDigits: 0 }) }</span>
                                                </div>

                                                <div class="custom-card__flex">
                                                    <span>Вернется налогами:</span>
                                                    <span class="custom-card__price">от ${ Number(chars["Сумма НДС к возмещению"]).toLocaleString('ru-RU', { style: 'currency', currency: 'RUB', minimumFractionDigits: 0 }) }</span>
                                                </div>

                                                <span class="custom-card__sku">${ product.uid }</span>
                                            </div>
                                        </div>
                                        <a
                                            onclick="window.passObjectDataInFeedBackModal(${ product.uid })"
                                            class="custom-card__request-button"
                                            href="#real_estate_feedback"
                                        >
                                            Запросить объект
                                        </a>
                                    `
                                    return productCard
                                })

                                if (composedCards.length) {
                                    customCardsPlace.append(...composedCards)
                                    customCatalogPlace.style.opacity = '1'
                                }
                            }
                        }
                    }).catch((error) => {
                        console.log('Ошибка получения позиций недвижимости: ' + error)
                })
            })
    })
</script>
